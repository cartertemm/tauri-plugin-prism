[package]
name = "tauri-plugin-prism"
version = "0.1.0"
edition = "2021"
description = "Screen reader and speech output for Tauri through prism"
license = "MIT"
repository = "https://github.com/cartertemm/tauri-plugin-prism"
links = "tauri-plugin-prism"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
prismer = { git = "https://github.com/trypsynth/prismer", rev = "3aed6f8", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = ["static"]
static = ["prismer/static"]
shared = []
